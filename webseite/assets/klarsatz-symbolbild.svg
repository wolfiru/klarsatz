<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300"
     role="img" aria-label="Ein Klarsatz-Programm wird geschrieben und liefert seine Ausgabe">
<title>Klarsatz – Programm und Ausgabe</title>

<defs>
  <linearGradient id="grund" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#12150f"/>
    <stop offset="1" stop-color="#0a0c09"/>
  </linearGradient>

  <!-- Je Quelltextzeile ein Rechteck, dessen Breite den Tippvorgang zeigt. -->
  <clipPath id="t1"><rect x="44" y="40" width="0" height="20">
    <animate attributeName="width" dur="14s" repeatCount="indefinite"
      values="0;0;250;250;250;0" keyTimes="0;0.05;0.15;0.90;0.95;1"/></rect></clipPath>
  <clipPath id="t2"><rect x="44" y="66" width="0" height="20">
    <animate attributeName="width" dur="14s" repeatCount="indefinite"
      values="0;0;260;260;260;0" keyTimes="0;0.17;0.29;0.90;0.95;1"/></rect></clipPath>
  <clipPath id="t3"><rect x="44" y="92" width="0" height="20">
    <animate attributeName="width" dur="14s" repeatCount="indefinite"
      values="0;0;250;250;250;0" keyTimes="0;0.31;0.43;0.90;0.95;1"/></rect></clipPath>
  <clipPath id="t4"><rect x="44" y="118" width="0" height="20">
    <animate attributeName="width" dur="14s" repeatCount="indefinite"
      values="0;0;80;80;80;0" keyTimes="0;0.45;0.50;0.90;0.95;1"/></rect></clipPath>
</defs>

<style>
  .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, ui-monospace, monospace; font-size: 15px; }
  .nr   { fill: #4a4d45; font-size: 12px; }
  .bef  { fill: #d9b45a; font-weight: 700; }
  .str  { fill: #7fb069; }
  .zahl { fill: #e8a87c; }
  .txt  { fill: #f3efe6; }
  .dim  { fill: #b9b4a5; }
  .marke { fill: #d9b45a; }
</style>

<rect width="480" height="300" rx="10" fill="url(#grund)"/>

<!-- Feine Manuskriptlinien -->
<g stroke="#f3efe6" stroke-opacity="0.045" stroke-width="1">
  <path d="M0 40.5H480M0 66.5H480M0 92.5H480M0 118.5H480M0 144.5H480"/>
</g>
<line x1="36.5" y1="16" x2="36.5" y2="176" stroke="#d9b45a" stroke-opacity="0.22" stroke-width="1"/>

<!-- Kopfzeile -->
<g>
  <circle cx="20" cy="20" r="4" fill="#d9b45a" fill-opacity="0.8"/>
  <text class="mono dim" x="34" y="24" font-size="11" letter-spacing="1.5">HALLO.KLAR</text>
</g>

<!-- Zeilennummern -->
<g class="mono nr" text-anchor="end">
  <text x="30" y="55">1</text><text x="30" y="81">2</text>
  <text x="30" y="107">3</text><text x="30" y="133">4</text>
</g>

<!-- Quelltext, Zeile für Zeile getippt -->
<g class="mono">
  <g clip-path="url(#t1)"><text x="44" y="55">
    <tspan class="bef">Merke</tspan><tspan class="txt"> </tspan><tspan class="zahl">3</tspan><tspan class="txt"> als Anzahl.</tspan>
  </text></g>
  <g clip-path="url(#t2)"><text x="44" y="81">
    <tspan class="bef">Zähle</tspan><tspan class="txt"> von </tspan><tspan class="zahl">1</tspan><tspan class="txt"> bis Anzahl mit i:</tspan>
  </text></g>
  <g clip-path="url(#t3)"><text x="64" y="107">
    <tspan class="bef">Zeige</tspan><tspan class="str"> "Hallo "</tspan><tspan class="txt"> und i.</tspan>
  </text></g>
  <g clip-path="url(#t4)"><text x="44" y="133">
    <tspan class="bef">Ende.</tspan>
  </text></g>
</g>

<!-- Schreibmarke: wandert Zeile für Zeile mit und blinkt am Ende -->
<rect class="marke" width="2" height="17" x="44" y="41">
  <animate attributeName="x" dur="14s" repeatCount="indefinite" calcMode="linear"
    values="44;44;294;64;324;64;314;44;124;124;124;44"
    keyTimes="0;0.05;0.15;0.17;0.29;0.31;0.43;0.45;0.50;0.90;0.95;1"/>
  <animate attributeName="y" dur="14s" repeatCount="indefinite" calcMode="discrete"
    values="41;41;67;67;93;93;119;119;119;41"
    keyTimes="0;0.05;0.16;0.17;0.30;0.31;0.44;0.45;0.90;1"/>
  <animate attributeName="opacity" dur="1.1s" repeatCount="indefinite"
    values="1;1;0.15;0.15;1" keyTimes="0;0.45;0.5;0.95;1"/>
</rect>

<!-- Trennlinie zur Ausgabe -->
<line x1="0" y1="176" x2="480" y2="176" stroke="#d9b45a" stroke-opacity="0.3" stroke-width="1"/>
<text class="mono dim" x="20" y="198" font-size="11" letter-spacing="1.5">AUSGABE</text>

<!-- Ausgabe erscheint nach dem Lauf -->
<g class="mono">
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite"
      values="0;0;1;1;0" keyTimes="0;0.58;0.62;0.90;0.94"/>
    <text x="20" y="226"><tspan class="marke">› </tspan><tspan class="txt">Hallo 1</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite"
      values="0;0;1;1;0" keyTimes="0;0.65;0.69;0.90;0.94"/>
    <text x="20" y="250"><tspan class="marke">› </tspan><tspan class="txt">Hallo 2</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite"
      values="0;0;1;1;0" keyTimes="0;0.72;0.76;0.90;0.94"/>
    <text x="20" y="274"><tspan class="marke">› </tspan><tspan class="txt">Hallo 3</tspan></text>
  </g>
</g>

<rect x="0.5" y="0.5" width="479" height="299" rx="10" fill="none"
      stroke="#f3efe6" stroke-opacity="0.12"/>
</svg>
